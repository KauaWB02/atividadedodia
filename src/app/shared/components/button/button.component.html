<button
  (click)="eventClick()"
  [disabled]="disable"
  [type]="typeButton"
  [ngClass]="getButtonClasses()"
  class="flex justify-center gap-1 items-center w-28 font-semibold border p-2 rounded-lg bg-sky-300 text-black border-sky-600 disabled:bg-gray-500 disabled:border-gray-500 ">
  <ng-container *ngIf="loading; else isNotLoading">
    <svg
      [ngClass]="loadingClass"
      class="animate-spin text-white w-4 h-4"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24">
      <circle
        class="opacity-25"
        cx="12"
        cy="12"
        r="10"
        stroke="currentColor"
        stroke-width="4"></circle>
      <path
        class="opacity-75"
        fill="currentColor"
        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
  </ng-container>

  <ng-template #isNotLoading>
    <ng-container *ngIf="activateIcon">
      <i
        [ngClass]="iconClass"
        class="material-icons"
        >{{ iconLabel }}</i
      >
    </ng-container>
    <span [ngClass]="labelClass"> {{ buttonLabel }}</span>
  </ng-template>
</button>
